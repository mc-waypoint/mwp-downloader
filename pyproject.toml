[project]
name = "mwp-downloader"
version = "0.1.0"
description = "Manifest-driven resumable download manager with a NiceGUI interface"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27",
    "nicegui>=2.0",
    "pywebview",
]

[dependency-groups]
build = [
    "nuitka>=2.7",
    "zstandard",
    "ordered-set",
]
